name = "comaps-traffic"
main = "src/entry/worker.ts"

# node:zlib needs nodejs_compat, and the compatibility date must be at or after the release
# that enabled it. deflateSync then behaves identically here and under Node, so the values
# encoder is a single code path.
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# KV holds everything: the uploaded indexes, the generated bodies, and small mutable state.
#
# Deliberately no id here. Wrangler and the Deploy to Cloudflare button create the namespace for
# you on first deploy, named after the Worker, and write the id back to this file. Filling it in
# by hand means the deploy fails until you have created it yourself first.
[[kv_namespaces]]
binding = "KV_STATE"

# R2 is optional and off by default. It has a free tier, but enabling R2 on an account is a
# separate subscription step, and the deploy fails outright on an account that has not done it.
# KV is included in the free plan with no such step, and the objects are small: a whole-region
# index is ~400 KB and a generated body a few KB, against KV's 25 MiB per-value limit.
#
# What KV costs you is write quota -- 1,000/day on the free plan, against one write per refresh.
# If you outgrow that, uncomment this and redeploy; the Worker detects the binding and moves
# indexes and bodies to R2 on its own, leaving only state in KV.
#
# [[r2_buckets]]
# binding = "R2_INDEX"

[vars]
# Everything here has a working default, and the Deploy to Cloudflare flow shows these as
# editable fields -- so only settings someone can actually answer belong here. Coverage areas,
# the public URL and the admin token are all worked out at runtime instead.

# How stale traffic may get before a client request refreshes it. One of 300, 600, 1800, 3600 --
# 5 min, 10 min, 30 min, 1 hour. This is a bound, not a schedule: nothing runs on a timer, so an
# area nobody is looking at costs nothing at all.
#
# 30 minutes by default. TomTom reports incidents, which persist for tens of minutes, so a
# shorter bound mostly fetches the same data again. Changeable later without redeploying, on the
# /setup page or via PUT /admin/refresh-interval.
TRAFFIC_REFRESH_SECONDS = "1800"

# The only cap on spend. One refresh is one TomTom call and one KV write, so this bounds both;
# 900 keeps it under the free plan's 1,000 KV writes/day, which binds before TomTom's 2,500.
# Bind R2 (above) and this can go up to whatever your provider key allows.
TRAFFIC_DAILY_REQUEST_BUDGET = "900"

# What the phone shows as the server's name. Cosmetic.
TRAFFIC_SERVER_NAME = "My CoMaps traffic"

# TOMTOM_API_KEY is the one secret, listed in .dev.vars.example so the Deploy to Cloudflare flow
# prompts for it. From the CLI: `wrangler secret put TOMTOM_API_KEY`.
#
# Deliberately absent:
#   TRAFFIC_AREAS            areas arrive from the app's "Cover this area"; this would only be a
#                            /healthz reporting list, and asking for map names and version
#                            stamps at deploy time is unanswerable.
#   TRAFFIC_PUBLIC_BASE_URL  empty means "use the URL the request arrived on", which is right on
#                            workers.dev and cannot be known before the Worker exists. Set it
#                            only behind a custom domain or a proxy.
#   TRAFFIC_ADMIN_TOKEN      generated on first use and shown on /setup.
